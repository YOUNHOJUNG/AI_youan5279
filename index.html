<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나에게 맞는 직무 유형 테스트</title>
    <meta
      name="description"
      content="12개 대학생활 질문으로 내 일하는 스타일을 알아보고 어울리는 직무(기획·개발·디자인·데이터)와 추천 자격증·과목을 확인하는 진로 탐색 테스트입니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css"
    />
    <style>
      :root {
        --font-sans: "Pretendard Variable", "Pretendard", "Plus Jakarta Sans",
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR",
          sans-serif;
        --font-display: "Plus Jakarta Sans", "Pretendard Variable", "Pretendard",
          sans-serif;
        --bg-default: radial-gradient(
            1100px 620px at 12% -8%,
            rgba(196, 181, 253, 0.34),
            transparent 62%
          ),
          radial-gradient(
            900px 540px at 92% 108%,
            rgba(221, 214, 254, 0.42),
            transparent 60%
          ),
          #f6f3ff;
        --ink-primary: #1f1638;
        --accent-violet: #6d28d9;
        --accent-violet-hover: #5b21b6;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-sans);
        color: var(--ink-primary);
        background-color: #f6f3ff;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg-default);
        color: var(--ink-primary);
      }

      button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      button:focus-visible {
        outline: 2px solid #7c3aed;
        outline-offset: 2px;
      }

      .font-display-num {
        font-family: var(--font-display);
        font-variant-numeric: tabular-nums;
      }

      .app-wrapper {
        min-height: 100dvh;
        width: 100%;
        transition: background 0.35s ease;
      }

      .container {
        width: 100%;
        max-width: 1024px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .quiz-container {
        width: 100%;
        max-width: 672px;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 16px 16px 32px;
        display: flex;
        flex-direction: column;
      }

      /* Animations */
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.988);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes choicePop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.035);
        }
        70% {
          transform: scale(0.985);
        }
        100% {
          transform: scale(1);
        }
      }

      .animate-enter {
        animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-choice-pop {
        animation: choicePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Start Screen */
      .start-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .card-surface {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #e6dfff;
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 18px 48px -16px rgba(109, 40, 217, 0.14);
      }

      .start-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        align-items: center;
      }

      .start-visual {
        order: 1;
        border-radius: 18px;
        border: 1px solid #ece6ff;
        background: #f5f2ff;
        overflow: hidden;
      }

      .start-copy {
        order: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .kicker {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: #6d28d9;
      }

      .start-title {
        margin: 10px 0 0;
        font-size: 34px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: #1f1638;
        text-wrap: balance;
      }

      .start-desc {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.7;
        color: #43395e;
        max-width: 440px;
      }

      .start-meta {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        font-size: 14px;
        font-weight: 500;
        color: #645a82;
      }

      .btn-primary {
        margin-top: 28px;
        width: 100%;
        min-height: 60px;
        padding: 16px 32px;
        border-radius: 16px;
        background: #6d28d9;
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 10px 24px -6px rgba(109, 40, 217, 0.45);
        transition: transform 0.16s ease, background-color 0.16s ease;
      }

      .btn-primary:hover {
        background: #5b21b6;
        transform: translateY(-2px);
      }

      .btn-primary:active {
        transform: scale(0.96);
      }

      /* Quiz Screen */
      .quiz-header-row {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .btn-back {
        min-height: 48px;
        padding: 0 12px;
        margin-left: -8px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        color: #524673;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background-color 0.15s ease;
      }

      .btn-back:hover {
        background: #ede7ff;
        color: #1f1638;
      }

      .quiz-brand {
        font-size: 15px;
        font-weight: 700;
        color: #524673;
      }

      .quiz-counter {
        font-size: 16px;
        font-weight: 800;
        color: #6d28d9;
      }

      .progress-track {
        margin-top: 8px;
        height: 12px;
        width: 100%;
        border-radius: 999px;
        background: #e8e0ff;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #8b5cf6 0%, #6d28d9 100%);
        transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .quiz-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px 0;
      }

      .question-card {
        background: #ffffff;
        border: 1px solid #e6dfff;
        border-radius: 24px;
        padding: 22px 20px;
        box-shadow: 0 16px 40px -14px rgba(109, 40, 217, 0.14);
      }

      .question-situation {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: #6d28d9;
      }

      .question-title {
        margin: 12px 0 0;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.42;
        letter-spacing: -0.015em;
        color: #1f1638;
        text-wrap: balance;
      }

      .options-list {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .option-btn {
        width: 100%;
        min-height: 88px;
        padding: 18px 16px;
        border-radius: 18px;
        border: 2px solid #ece6ff;
        background: #fbf9ff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        text-align: left;
        transition: transform 0.15s ease, border-color 0.15s ease,
          background-color 0.15s ease, box-shadow 0.15s ease;
      }

      .option-btn:hover:not(:disabled) {
        border-color: #c4b5fd;
        background: #f5f0ff;
        transform: translateY(-2px);
      }

      .option-btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .option-btn.is-selected {
        border-color: #7c3aed;
        background: #f3eeff;
        box-shadow: 0 8px 20px -8px rgba(124, 58, 237, 0.32);
      }

      .option-left {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .option-badge {
        flex-shrink: 0;
        margin-top: 2px;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: #ede6ff;
        color: #5b21b6;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .option-btn.is-selected .option-badge {
        background: #6d28d9;
        color: #ffffff;
      }

      .option-label {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.55;
        color: #22183e;
      }

      .option-check {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #6d28d9;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.75);
        transition: opacity 0.15s ease, transform 0.15s ease;
      }

      .option-btn.is-selected .option-check {
        opacity: 1;
        transform: scale(1);
      }

      /* Result Screen */
      .result-stack {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .result-hero-card {
        border-radius: 24px;
        border: 1px solid var(--role-border);
        background: var(--role-hero-bg);
        padding: 24px;
        box-shadow: 0 20px 50px -16px rgba(31, 22, 56, 0.14);
      }

      .result-hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        align-items: center;
      }

      .result-visual {
        order: 1;
        max-width: 300px;
        width: 100%;
        margin: 0 auto;
        border-radius: 22px;
        border: 1px solid var(--role-border);
        background: var(--role-soft);
        overflow: hidden;
      }

      .result-copy {
        order: 2;
      }

      .result-kicker {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      .result-title {
        margin: 12px 0 0;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.025em;
        color: var(--role-ink);
        text-wrap: balance;
      }

      .result-nickname {
        margin: 12px 0 0;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.4;
        color: var(--role-accent-text);
      }

      .result-desc {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.75;
        color: #352c50;
      }

      .strengths-box {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--role-border);
      }

      .strengths-heading {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #5e547a;
      }

      .strengths-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 15px;
        color: #281e42;
      }

      .strengths-list li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        line-height: 1.55;
      }

      .strength-dot {
        margin-top: 8px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--role-accent);
        flex-shrink: 0;
      }

      .result-bottom-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .result-panel {
        border-radius: 24px;
        border: 1px solid var(--role-border);
        background: rgba(255, 255, 255, 0.96);
        padding: 24px;
        box-shadow: 0 12px 36px -14px rgba(31, 22, 56, 0.1);
      }

      .panel-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .panel-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        color: var(--role-ink);
      }

      .panel-sub {
        font-size: 14px;
        font-weight: 600;
        color: #6c618b;
      }

      .rec-list {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
      }

      .rec-item {
        padding: 16px 0;
        border-top: 1px solid var(--role-bar-track);
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .rec-item:first-child {
        border-top: none;
        padding-top: 6px;
      }

      .rec-item:last-child {
        padding-bottom: 4px;
      }

      .rec-num {
        flex-shrink: 0;
        margin-top: 2px;
        width: 32px;
        height: 32px;
        border-radius: 12px;
        background: var(--role-soft);
        color: var(--role-accent-text);
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .rec-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 8px;
      }

      .rec-title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        color: #1f1638;
      }

      .rec-cat {
        font-size: 14px;
        font-weight: 600;
        color: var(--role-accent);
      }

      .rec-reason {
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #463d62;
      }

      .dist-list {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .dist-row-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
      }

      .dist-track {
        margin-top: 8px;
        height: 10px;
        width: 100%;
        border-radius: 999px;
        background: var(--role-bar-track);
        overflow: hidden;
      }

      .dist-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .starter-tip {
        margin-top: 24px;
        border-radius: 16px;
        background: var(--role-soft);
        padding: 16px 18px;
      }

      .starter-tip-label {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: var(--role-accent-text);
      }

      .starter-tip-text {
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #342a4f;
      }

      .result-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 6px;
      }

      .btn-share {
        width: 100%;
        min-height: 58px;
        padding: 16px 28px;
        border-radius: 16px;
        border: 2px solid var(--role-border);
        background: #ffffff;
        color: var(--role-ink);
        font-size: 17px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(31, 22, 56, 0.05);
        transition: transform 0.15s ease, background-color 0.15s ease;
      }

      .btn-share:active {
        transform: scale(0.96);
      }

      .btn-restart {
        width: 100%;
        min-height: 58px;
        padding: 16px 32px;
        border-radius: 16px;
        background: var(--role-accent);
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 12px 28px -6px rgba(31, 22, 56, 0.28);
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .btn-restart:hover {
        opacity: 0.94;
        transform: translateY(-2px);
      }

      .btn-restart:active {
        transform: scale(0.96);
      }

      /* Tablet & Desktop Breakpoints */
      @media (min-width: 640px) {
        .container {
          padding: 40px 32px;
        }
        .quiz-container {
          padding: 32px 24px 40px;
        }
        .card-surface {
          padding: 40px;
        }
        .question-card {
          padding: 36px;
        }
        .option-btn {
          padding: 20px 24px;
        }
        .option-left {
          align-items: center;
        }
        .option-badge {
          margin-top: 0;
        }
        .result-hero-card {
          padding: 36px;
        }
        .result-panel {
          padding: 32px;
        }
        .result-title {
          font-size: 48px;
        }
        .btn-primary {
          width: auto;
          min-height: 56px;
          font-size: 16px;
        }
        .result-actions {
          flex-direction: row;
          justify-content: center;
          gap: 16px;
        }
        .btn-share,
        .btn-restart {
          width: auto;
          min-width: 190px;
        }
      }

      @media (min-width: 768px) {
        .result-hero-grid {
          grid-template-columns: 7fr 5fr;
          gap: 40px;
        }
        .result-copy {
          order: 1;
        }
        .result-visual {
          order: 2;
          max-width: none;
        }
      }

      @media (min-width: 1024px) {
        .card-surface {
          padding: 48px;
        }
        .start-grid {
          grid-template-columns: 1fr 1fr;
          gap: 48px;
        }
        .start-copy {
          order: 1;
        }
        .start-visual {
          order: 2;
        }
        .start-title {
          font-size: 44px;
        }
        .result-title {
          font-size: 52px;
        }
        .result-bottom-grid {
          grid-template-columns: 7fr 5fr;
          gap: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-wrapper"></div>

    <script>
      const ROLE_LABELS = {
        PM: "기획 (PM)",
        DEV: "개발",
        DESIGN: "디자인",
        DATA: "데이터",
      };

      const QUIZ_QUESTIONS = [
        {
          id: 1,
          situation: "조별과제 첫 모임",
          question: "새 조별과제 첫 회의, 다들 어색해서 아무 말도 안 꺼낼 때 나는?",
          options: [
            { id: "A", label: "오늘 정해야 할 주제와 역할 분담부터 먼저 꺼내자고 제안한다", role: "PM" },
            { id: "B", label: "발표 자료 분위기나 참고할 만한 예시 이미지를 먼저 찾아 띄워본다", role: "DESIGN" },
          ],
        },
        {
          id: 2,
          situation: "동아리 축제 부스",
          question: "동아리 부스 운영을 맡게 됐다. 가장 먼저 머리에 떠오르는 고민은?",
          options: [
            { id: "A", label: "사람들이 줄 서지 않고 자연스럽게 구경할 수 있는 순서와 운영 동선", role: "PM" },
            { id: "B", label: "QR 주문이나 자동 집계 폼처럼 현장에서 편하게 쓸 수 있는 도구 세팅", role: "DEV" },
          ],
        },
        {
          id: 3,
          situation: "카페 아르바이트",
          question: "주말 알바 중 유독 특정 시간대에만 손님이 몰리는 걸 발견했다.",
          options: [
            { id: "A", label: "최근 몇 주간 시간대별 매출과 인기 메뉴 기록을 슬쩍 비교해 본다", role: "DATA" },
            { id: "B", label: "피크 타임에 맞춰 재료 준비와 파트너 역할을 미리 나눠두자고 건의한다", role: "PM" },
          ],
        },
        {
          id: 4,
          situation: "발표 전날 밤",
          question: "팀 발표 자료를 최종 점검할 때 내 눈이 가장 먼저 가는 부분은?",

            <path d="M96 122L74 144L96 166" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M224 122L246 144L224 166" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M172 114L148 174" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
            <rect x="76" y="206" width="76" height="58" rx="14" fill="#FFFFFF" stroke="#CFD8FF" stroke-width="2"/>
            <rect x="168" y="206" width="76" height="58" rx="14" fill="#4338CA"/>
            <rect x="92" y="228" width="44" height="12" rx="6" fill="#4338CA"/>
            <rect x="184" y="228" width="44" height="12" rx="6" fill="#C7D2FE"/>
          </svg>`,
          DESIGN: `<svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
            <rect width="320" height="320" fill="#FCF0FA"/>
            <rect x="50" y="58" width="164" height="196" rx="20" fill="#FFFFFF" stroke="#F1CCE9" stroke-width="2"/>
            <rect x="70" y="80" width="124" height="66" rx="12" fill="#F8E3F6"/>
            <circle cx="132" cy="113" r="18" fill="#A21CAF"/>
            <rect x="70" y="164" width="90" height="10" rx="5" fill="#D946EF" fill-opacity="0.35"/>
            <rect x="70" y="184" width="124" height="10" rx="5" fill="#F3DDF1"/>
            <rect x="70" y="210" width="76" height="24" rx="12" fill="#A21CAF"/>
            <rect x="188" y="128" width="84" height="132" rx="16" fill="#FFFFFF" stroke="#E8A8DE" stroke-width="2"/>
            <rect x="202" y="144" width="56" height="28" rx="8" fill="#A21CAF"/>
            <rect x="202" y="182" width="56" height="28" rx="8" fill="#E879F9"/>
            <rect x="202" y="220" width="56" height="28" rx="8" fill="#F5D0FE"/>
          </svg>`,
          DATA: `<svg viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
            <rect width="320" height="320" fill="#EDF4FF"/>
            <rect x="44" y="56" width="232" height="208" rx="22" fill="#FFFFFF" stroke="#C9DFFF" stroke-width="2"/>
            <rect x="72" y="176" width="28" height="62" rx="8" fill="#BFDBFE"/>
            <rect x="114" y="142" width="28" height="96" rx="8" fill="#93C5FD"/>
            <rect x="156" y="112" width="28" height="126" rx="8" fill="#3B82F6"/>
            <rect x="198" y="86" width="28" height="152" rx="8" fill="#1D4ED8"/>
            <path d="M84 152L128 122L170 96L212 72" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>
            <circle cx="212" cy="72" r="7" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3"/>
          </svg>`,
        };
        return svgs[roleId] || svgs.HERO;
      }

      // Application State
      let stage = "start"; // 'start' | 'quiz' | 'result'
      let currentIndex = 0;
      let answers = {};
      let isTransitioning = false;
      let transitionTimer = null;
      let copiedFeedback = false;

      const appEl = document.getElementById("app");

      function calculateResult() {
        const scores = { PM: 0, DEV: 0, DESIGN: 0, DATA: 0 };
        const lastChosen = { PM: -1, DEV: -1, DESIGN: -1, DATA: -1 };

        QUIZ_QUESTIONS.forEach((q, idx) => {
          const picked = answers[q.id];
          if (picked) {
            scores[picked.role] += 1;
            lastChosen[picked.role] = idx;
          }
        });

        const sorted = Object.keys(scores).sort((a, b) => {
          if (scores[b] !== scores[a]) return scores[b] - scores[a];
          return lastChosen[b] - lastChosen[a];
        });

        return {
          primary: JOB_ROLE_RESULTS[sorted[0]],
          secondary: scores[sorted[1]] >= 3 ? JOB_ROLE_RESULTS[sorted[1]] : null,
          scores,
        };
      }

      function render() {
        if (stage === "start") {
          appEl.style.background = "";
          appEl.innerHTML = `
            <main class="container start-shell">
              <section class="card-surface animate-enter">
                <div class="start-grid">
                  <div class="start-visual">${getRoleSvg("HERO")}</div>
                  <div class="start-copy">
                    <p class="kicker">대학생 2~4학년을 위한 진로 탐색</p>
                    <h1 class="start-title">나에게 맞는<br />직무 유형 테스트</h1>
                    <p class="start-desc">
                      직무 용어를 잘 몰라도 괜찮아요. 조별과제, 동아리, 아르바이트처럼
                      익숙한 대학생활 12가지 장면에서 나다운 선택을 고르면 어울리는 직무와
                      지금 준비할 과목·자격증을 알려드릴게요.
                    </p>
                    <div class="start-meta">
                      <span>총 12문항</span>
                      <span aria-hidden="true">·</span>
                      <span>약 2분 소요</span>
                      <span aria-hidden="true">·</span>
                      <span>기획 · 개발 · 디자인 · 데이터</span>
                    </div>
                    <button type="button" id="start-btn" class="btn-primary">
                      <span>시작하기</span>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </section>
            </main>
          `;

          document.getElementById("start-btn").addEventListener("click", () => {
            answers = {};
            currentIndex = 0;
            stage = "quiz";
            window.scrollTo({ top: 0, behavior: "smooth" });
            render();
          });
          return;
        }

        if (stage === "quiz") {
          appEl.style.background = "";
          const q = QUIZ_QUESTIONS[currentIndex];
          const total = QUIZ_QUESTIONS.length;
          const pct = Math.round(((currentIndex + 1) / total) * 100);
          const prevSelected = answers[q.id];

          appEl.innerHTML = `
            <div class="quiz-container">
              <header>
                <div class="quiz-header-row">
                  ${
                    currentIndex > 0
                      ? `<button type="button" id="back-btn" class="btn-back">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                          <span>이전</span>
                        </button>`
                      : `<span class="quiz-brand">직무 유형 테스트</span>`
                  }
                  <div class="font-display-num quiz-counter">${currentIndex + 1}/${total}</div>
                </div>
                <div class="progress-track" role="progressbar" aria-valuenow="${currentIndex + 1}" aria-valuemin="1" aria-valuemax="${total}">
                  <div class="progress-fill" style="width: ${pct}%"></div>
                </div>
              </header>

              <main class="quiz-stage">
                <section class="question-card animate-enter">
                  <p class="question-situation">Q${q.id}. ${q.situation}</p>
                  <h2 class="question-title">${q.question}</h2>
                  <div class="options-list">
                    ${q.options
                      .map((opt) => {
                        const selected = prevSelected && prevSelected.id === opt.id;
                        return `
                          <button type="button" class="option-btn ${selected ? "is-selected" : ""}" data-opt="${opt.id}">
                            <div class="option-left">
                              <span class="font-display-num option-badge">${opt.id}</span>
                              <span class="option-label">${opt.label}</span>
                            </div>
                            <span class="option-check" aria-hidden="true">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                            </span>
                          </button>
                        `;
                      })
                      .join("")}
                  </div>
                </section>
              </main>
            </div>
          `;

          if (currentIndex > 0) {
            document.getElementById("back-btn").addEventListener("click", () => {
              if (isTransitioning) return;
              currentIndex = Math.max(0, currentIndex - 1);
              render();
            });
          }

          document.querySelectorAll(".option-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (isTransitioning) return;
              isTransitioning = true;

              const optId = btn.getAttribute("data-opt");
              const chosen = q.options.find((o) => o.id === optId);

              document.querySelectorAll(".option-btn").forEach((el) => {
                el.classList.remove("is-selected", "animate-choice-pop");
                el.disabled = true;
              });

              btn.classList.add("is-selected", "animate-choice-pop");
              answers[q.id] = chosen;

              if (transitionTimer) clearTimeout(transitionTimer);
              transitionTimer = setTimeout(() => {
                isTransitioning = false;
                if (currentIndex + 1 < total) {
                  currentIndex += 1;
                } else {
                  stage = "result";
                  window.scrollTo({ top: 0, behavior: "smooth" });
                }
                render();
              }, 320);
            });
          });
          return;
        }

        if (stage === "result") {
          const { primary, secondary, scores } = calculateResult();
          const t = primary.theme;

          appEl.style.background = t.pageGradient;
          appEl.style.setProperty("--role-hero-bg", t.heroBg);
          appEl.style.setProperty("--role-border", t.cardBorder);
          appEl.style.setProperty("--role-soft", t.softSurface);
          appEl.style.setProperty("--role-accent", t.accent);
          appEl.style.setProperty("--role-accent-text", t.accentText);
          appEl.style.setProperty("--role-ink", t.inkPrimary);
          appEl.style.setProperty("--role-bar-track", t.barTrack);

          const orderedScores = Object.keys(scores)
            .map((id) => ({ id, label: ROLE_LABELS[id], count: scores[id] }))
            .sort((a, b) => b.count - a.count);

          appEl.innerHTML = `
            <main class="container animate-enter">
              <div class="result-stack">
                <section class="result-hero-card">
                  <div class="result-hero-grid">
                    <div class="result-visual">${getRoleSvg(primary.id)}</div>
                    <div class="result-copy">
                      <div class="result-kicker">
                        <span style="color: ${t.accent}">나의 직무 유형</span>
                        <span aria-hidden="true" style="color: #8E82AA">·</span>
                        <span class="font-display-num" style="color: #685D88">${primary.englishLabel}</span>
                      </div>
                      <h1 class="result-title">${primary.name}</h1>
                      <p class="result-nickname">“${primary.nickname}”</p>
                      <p class="result-desc">${primary.description}</p>
                      <div class="strengths-box">
                        <p class="strengths-heading">이런 강점이 돋보여요</p>
                        <ul class="strengths-list">
                          ${primary.strengths
                            .map(
                              (s) => `<li><span class="strength-dot" aria-hidden="true"></span><span>${s}</span></li>`
                            )
                            .join("")}
                        </ul>
                      </div>
                    </div>
                  </div>
                </section>

                <div class="result-bottom-grid">
                  <section class="result-panel">
                    <div class="panel-header">
                      <h2 class="panel-title">추천 자격증 · 과목 3가지</h2>
                      <span class="panel-sub">대학생 입문 기준</span>
                    </div>
                    <ol class="rec-list">
                      ${primary.recommendations
                        .map(
                          (rec, idx) => `
                            <li class="rec-item">
                              <span class="font-display-num rec-num">0${idx + 1}</span>
                              <div>
                                <div class="rec-title-row">
                                  <h3 class="rec-title">${rec.title}</h3>
                                  <span class="rec-cat">· ${rec.category}</span>
                                </div>
                                <p class="rec-reason">${rec.reason}</p>
                              </div>
                            </li>
                          `
                        )
                        .join("")}
                    </ol>
                  </section>

                  <section class="result-panel" style="display:flex;flex-direction:column;justify-content:space-between;">
                    <div>
                      <h2 class="panel-title">내 일하는 스타일 분포</h2>
                      <p class="panel-sub" style="display:block;margin-top:4px;">12개 질문에서 선택한 성향 비율이에요</p>
                      <div class="dist-list">
                        ${orderedScores
                          .map((item) => {
                            const isTop = item.id === primary.id;
                            const barPct = Math.max(Math.round((item.count / 6) * 100), 6);
                            return `
                              <div>
                                <div class="dist-row-head">
                                  <span style="font-weight:${isTop ? "700" : "600"};color:${isTop ? t.accentText : "#463D62"}">${item.label}</span>
                                  <span class="font-display-num" style="font-size:14px;font-weight:700;color:#5F557D">${item.count}/6회</span>
                                </div>
                                <div class="dist-track">
                                  <div class="dist-fill" style="width:${barPct}%;background:${isTop ? t.accent : t.barMuted}"></div>
                                </div>
                              </div>
                            `;
                          })
                          .join("")}
                      </div>
                      ${
                        secondary
                          ? `<p style="margin:20px 0 0;font-size:14px;line-height:1.6;color:#524870;">함께 높게 나온 성향: <strong style="color:#1F1638">${secondary.name}</strong> 역량도 잘 어울려요.</p>`
                          : ""
                      }
                    </div>
                    <div class="starter-tip">
                      <p class="starter-tip-label">이번 학기 작은 실천 팁</p>
                      <p class="starter-tip-text">${primary.starterTip}</p>
                    </div>
                  </section>
                </div>

                <div class="result-actions">
                  <button type="button" id="share-btn" class="btn-share">
                    ${
                      copiedFeedback
                        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${t.accent}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span style="color:${t.accentText}">클립보드에 복사되었어요!</span>`
                        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${t.accent}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg><span>공유하기</span>`
                    }
                  </button>
                  <button type="button" id="restart-btn" class="btn-restart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>다시하기</span>
                  </button>
                </div>
              </div>
            </main>
          `;

          document.getElementById("share-btn").addEventListener("click", async () => {
            const summary = [
              "[나에게 맞는 직무 유형 테스트 결과]",
              `나의 직무 유형: ${primary.name}`,
              `"${primary.nickname}"`,
              "",
              primary.description,
              "",
              "추천 자격증·과목:",
              ...primary.recommendations.map(
                (r, idx) => `${idx + 1}. ${r.title} (${r.category})`
              ),
            ].join("\n");

            let ok = false;
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(summary);
                ok = true;
              }
            } catch {
              ok = false;
            }

            if (!ok) {
              try {
                const ta = document.createElement("textarea");
                ta.value = summary;
                ta.setAttribute("readonly", "");
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                ok = document.execCommand("copy");
                document.body.removeChild(ta);
              } catch {
                ok = false;
              }
            }

            if (ok) {
              copiedFeedback = true;
              render();
              setTimeout(() => {
                copiedFeedback = false;
                if (stage === "result") render();
              }, 2400);
            }
          });

          document.getElementById("restart-btn").addEventListener("click", () => {
            answers = {};
            currentIndex = 0;
            copiedFeedback = false;
            stage = "start";
            window.scrollTo({ top: 0, behavior: "smooth" });
            render();
          });
        }
      }

      render();
    </script>
  </body>
</html>
